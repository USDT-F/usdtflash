<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Chat ID</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .steps {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        .steps ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .steps li {
            margin: 10px 0;
        }
        
        .steps strong {
            color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .chat-id {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px solid #667eea;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #667eea;
        }
        
        .copy-btn {
            background: #28a745;
            padding: 10px 20px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .copy-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Get Your Chat ID</h1>
        
        <div class="steps">
            <strong>📋 Instructions:</strong>
            <ol>
                <li>Open Telegram and search for your bot</li>
                <li>Click <strong>START</strong> or send any message to the bot</li>
                <li>Come back here and click the button below</li>
            </ol>
        </div>
        
        <button id="getChatIdBtn" onclick="getChatId()">
            🔍 Get My Chat ID
        </button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        async function getChatId() {
            const btn = document.getElementById('getChatIdBtn');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerHTML = '⏳ Fetching...';
            result.style.display = 'none';
            
            const TELEGRAM_BOT_TOKEN = '7746028957:AAE5HFQgmjm8qgZPtdn2Ot_iNmMX1ZdJ1nU';
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.ok && data.result.length > 0) {
                    result.className = 'result success';
                    
                    // Get all unique chat IDs
                    const chatIds = new Set();
                    data.result.forEach(update => {
                        if (update.message && update.message.chat) {
                            chatIds.add(update.message.chat.id);
                        }
                    });
                    
                    if (chatIds.size > 0) {
                        const chatIdArray = Array.from(chatIds);
                        const latestChatId = data.result[data.result.length - 1].message.chat.id;
                        
                        result.innerHTML = `
✅ <strong>Success! Found Chat ID(s):</strong>

<div class="chat-id">${latestChatId}</div>

<button class="copy-btn" onclick="copyToClipboard('${latestChatId}')">
    📋 Copy Chat ID
</button>

<hr style="margin: 20px 0; border: none; border-top: 1px solid #c3e6cb;">

<strong>📝 All Chat IDs found:</strong>
${chatIdArray.map(id => `• ${id}`).join('\n')}

<hr style="margin: 20px 0; border: none; border-top: 1px solid #c3e6cb;">

<strong>🔧 Next Steps:</strong>
1. Copy the Chat ID above
2. Update your login.html file
3. Replace TELEGRAM_CHAT_ID with: <strong>${latestChatId}</strong>
                        `;
                        btn.innerHTML = '✅ Chat ID Found!';
                    } else {
                        result.className = 'result error';
                        result.innerHTML = `
❌ <strong>No messages found!</strong>

Please:
1. Open Telegram
2. Search for your bot
3. Click START or send any message
4. Come back and try again
                        `;
                        btn.innerHTML = '🔍 Get My Chat ID';
                        btn.disabled = false;
                    }
                } else if (data.ok && data.result.length === 0) {
                    result.className = 'result error';
                    result.innerHTML = `
❌ <strong>No messages found!</strong>

Please:
1. Open Telegram
2. Search for your bot
3. Click START or send any message
4. Come back and try again
                    `;
                    btn.innerHTML = '🔍 Get My Chat ID';
                    btn.disabled = false;
                } else {
                    result.className = 'result error';
                    result.innerHTML = `❌ <strong>Error:</strong> ${data.description || 'Failed to get updates'}`;
                    btn.innerHTML = '❌ Failed';
                    btn.disabled = false;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
                btn.innerHTML = '❌ Failed';
                btn.disabled = false;
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Chat ID copied to clipboard!');
            }).catch(err => {
                alert('❌ Failed to copy: ' + err);
            });
        }
    </script>
</body>
</html>
