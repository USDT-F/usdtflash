<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Transactions - USDT-FLASH Mobile</title>
    <link rel="icon" type="image/png" href="../img/usdt_cryptocurrencies_icon_188337.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        .mobile-tabs {
            position: sticky;
            top: 0;
            z-index: 40;
            background: linear-gradient(135deg, #0f1419 0%, #1a2e1a 25%, #26a17b 50%, #1a8462 75%, #0e4b36 100%);
            padding: 0.75rem;
            gap: 0.5rem;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
        }
        
        .mobile-tab {
            flex: 1;
            min-width: 100px;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 0.75rem;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .mobile-tab.active {
            background: linear-gradient(135deg, #26a17b, #1a8462);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 4px 12px rgba(38,161,123,0.4);
        }
        
        .mobile-tab i {
            display: block;
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #ffffff 25%, #e5e7eb 50%, #f3f4f6 75%, #ffffff 100%);">
    
    <!-- Header -->
    <header class="text-white shadow-2xl" style="background: linear-gradient(135deg, #0f1419 0%, #1a2e1a 25%, #26a17b 50%, #1a8462 75%, #0e4b36 100%);">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT" class="h-10 w-10 mr-3">
                    <div>
                        <h1 class="text-xl font-black text-white">Live Monitor</h1>
                        <p class="text-xs text-green-300">Real-time Activity</p>
                    </div>
                </div>
                <a href="../home.html" class="bg-gradient-to-r from-green-500 to-emerald-600 px-4 py-2 rounded-xl text-sm font-bold">
                    <i class="fas fa-home"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Mobile Tabs -->
    <div class="mobile-tabs">
        <div class="mobile-tab active" onclick="switchTab('community')">
            <i class="fas fa-globe-americas"></i>
            <span>Community</span>
        </div>
        <div class="mobile-tab" onclick="switchTab('transactions')">
            <i class="fas fa-chart-line"></i>
            <span>Transactions</span>
        </div>
        <div class="mobile-tab" onclick="switchTab('users')">
            <i class="fas fa-users"></i>
            <span>Users</span>
        </div>
    </div>

    <!-- Tab Contents -->
    <div class="container mx-auto px-4 py-4">
        
        <!-- Community Tab -->
        <div class="tab-content active" id="community-tab">
            <div class="bg-white rounded-2xl shadow-xl p-4 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800">
                        <i class="fas fa-globe text-green-500 mr-2"></i>
                        Global Community
                    </h2>
                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">
                        <i class="fas fa-circle animate-pulse mr-1"></i>2,847 Online
                    </span>
                </div>
                
                <div id="chat-messages" class="h-96 overflow-y-auto bg-gray-50 rounded-xl p-3 mb-4">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-comments text-4xl mb-2"></i>
                        <p>Loading messages...</p>
                    </div>
                </div>
                
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك..." class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-green-500">
                    <button onclick="sendMessage()" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-6 py-3 rounded-xl font-bold">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Transactions Tab -->
        <div class="tab-content" id="transactions-tab">
            <div class="bg-white rounded-2xl shadow-xl p-4 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800">
                        <i class="fas fa-chart-line text-blue-500 mr-2"></i>
                        Live Feed
                    </h2>
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">
                        <i class="fas fa-sync-alt animate-spin mr-1"></i>Live
                    </span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl p-3 text-center">
                        <div class="text-2xl font-black text-green-600">$47.8M</div>
                        <div class="text-xs text-gray-600">Volume 24h</div>
                    </div>
                    <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-xl p-3 text-center">
                        <div class="text-2xl font-black text-blue-600">12,847</div>
                        <div class="text-xs text-gray-600">Transactions</div>
                    </div>
                </div>
                
                <div id="transaction-feed" class="space-y-3 h-96 overflow-y-auto">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-spinner fa-spin text-4xl mb-2"></i>
                        <p>Loading transactions...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Users Tab -->
        <div class="tab-content" id="users-tab">
            <div class="bg-white rounded-2xl shadow-xl p-4 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-gray-800">
                        <i class="fas fa-users text-purple-500 mr-2"></i>
                        Online Users
                    </h2>
                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold">
                        <i class="fas fa-circle animate-pulse mr-1"></i><span id="users-count">2,847</span>
                    </span>
                </div>
                
                <div id="users-list" class="space-y-2 h-96 overflow-y-auto">
                    <div class="text-center text-gray-400 py-8">
                        <i class="fas fa-user-friends text-4xl mb-2"></i>
                        <p>Loading users...</p>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            document.querySelectorAll('.mobile-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            const tabContent = document.getElementById(tabName + '-tab');
            if (tabContent) {
                tabContent.classList.add('active');
            }
            
            event.target.closest('.mobile-tab').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                alert('تم إرسال رسالتك بنجاح!');
                input.value = '';
            }
        }
        
        // Initialize with sample data
        setTimeout(() => {
            document.getElementById('chat-messages').innerHTML = '<div class="bg-white rounded-lg p-3 mb-3 shadow"><div class="font-bold text-sm mb-1">Mohammed Al-Saud</div><div class="text-xs text-gray-600">مرحباً بالجميع! الموقع ممتاز 👍</div></div>';
            
            document.getElementById('transaction-feed').innerHTML = '<div class="bg-white rounded-lg p-3 border border-gray-200"><div class="flex items-center justify-between"><div class="flex items-center"><div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full mr-3"></div><div><div class="font-bold text-sm">Ahmed Hassan</div><div class="text-xs text-gray-500">Dubai, UAE</div></div></div><div class="text-right"><div class="font-bold text-green-600">$3,000</div><div class="text-xs text-gray-500">now</div></div></div></div>';
            
            document.getElementById('users-list').innerHTML = '<div class="flex items-center p-3 bg-white rounded-lg border border-gray-200"><div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full mr-3"></div><div class="flex-1"><div class="font-bold text-sm">Sarah Williams</div><div class="text-xs text-green-600">Active</div></div></div>';
        }, 1000);
    </script>

</body>
</html>
