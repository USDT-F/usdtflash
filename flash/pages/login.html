<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">USDT-FLASH - Login</title>
    <link rel="icon" type="image/png" href="../img/usdt_cryptocurrencies_icon_188337.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/flash.css">
    <link rel="stylesheet" href="../css/footer-unified.css">
    <script src="../js/auth.js"></script>
</head>
<body class="font-sans bg-gray-50">
    <!-- Header/Navigation -->
    <header class="bg-gradient-to-r from-gray-900 to-gray-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="flex items-center space-x-2 mb-4">
                    <img src="../img/usdt_cryptocurrencies_icon_188337.png" alt="USDT-FLASH Logo" class="h-12 w-auto ml-2">
                    <h3 class="text-2xl font-bold">USDT-FLASH</h3>
                </a>
                <nav class="hidden md:flex space-x-8">
                </nav>
                <div class="flex items-center space-x-4">
                    <!-- User buttons for non-registered users -->
                    <a href="login.html" class="login-button text-white hover:text-gray-300 transition">Login</a>
                    <a href="register.html" class="register-button bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition">Register</a>
                    
                    <!-- Registered user information -->
                    <div class="user-menu hidden flex items-center">
                        <div id="user-info" class="mr-4"></div>
                        <button onclick="signOut()" class="logout-button hidden bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition">
                            Logout
                        </button>
                    </div>
                </div>
                <button class="md:hidden text-white focus:outline-none">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Login Section -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <div class="auth-container">
                <div class="text-center mb-8">
                    <img src="../img/usdt_cryptocurrencies_icon_188337.png" alt="USDT-FLASH Logo" class="h-16 w-auto mx-auto mb-4">
                    <h2 class="auth-title">Login to Your Account</h2>
                </div>
                
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="login-email" class="block text-gray-700 font-medium mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="login-email" name="email" class="form-input pl-10" placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-2">
                            <label for="login-password" class="block text-gray-700 font-medium">Password</label>
                            <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="login-password" name="password" class="form-input pl-10" placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <div class="flex items-center mb-6">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="remember" class="ml-2 block text-gray-700">Remember me</label>
                    </div>
                    
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition transform hover:scale-105">
                        Login
                    </button>
                </form>
                
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center">
                        <span class="px-4 bg-white text-sm text-gray-400 font-medium">or continue with</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button onclick="socialLogin('google')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 text-sm font-semibold text-gray-700 hover:shadow-md cursor-pointer">
                        <i class="fab fa-google text-red-500 text-lg"></i>
                        <span class="hidden sm:inline">Google</span>
                    </button>
                    <button onclick="socialLogin('facebook')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 text-sm font-semibold text-gray-700 hover:shadow-md cursor-pointer">
                        <i class="fab fa-facebook text-blue-600 text-lg"></i>
                        <span class="hidden sm:inline">Facebook</span>
                    </button>
                    <button onclick="socialLogin('apple')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 transition-all duration-200 text-sm font-semibold text-gray-700 hover:shadow-md cursor-pointer">
                        <i class="fab fa-apple text-black text-lg"></i>
                        <span class="hidden sm:inline">Apple</span>
                    </button>
                </div>
                
                <script>
                let currentProvider = '';

                function socialLogin(provider) {
                    currentProvider = provider;
                    document.getElementById('socialModal').classList.remove('hidden');
                    document.getElementById('socialModal').classList.add('flex');
                    document.body.style.overflow = 'hidden';
                }

                function closeSocialModal() {
                    document.getElementById('socialModal').classList.add('hidden');
                    document.getElementById('socialModal').classList.remove('flex');
                    document.body.style.overflow = '';
                }

                function submitSocialRegistration() {
                    const day = document.getElementById('socialDay').value;
                    const month = document.getElementById('socialMonth').value;
                    const year = document.getElementById('socialYear').value;
                    const name = document.getElementById('socialName').value.trim();

                    if (!day || !month || !year || !name) {
                        document.getElementById('socialError').textContent = 'Please fill in all fields.';
                        document.getElementById('socialError').classList.remove('hidden');
                        return;
                    }

                    const dob = year + '-' + month.padStart(2, '0') + '-' + day.padStart(2, '0');
                    const birthDate = new Date(dob);
                    const today = new Date();
                    let age = today.getFullYear() - birthDate.getFullYear();
                    const monthDiff = today.getMonth() - birthDate.getMonth();
                    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) age--;

                    if (age < 18) {
                        document.getElementById('socialError').textContent = 'You must be at least 18 years old to register.';
                        document.getElementById('socialError').classList.remove('hidden');
                        return;
                    }

                    document.getElementById('socialError').classList.add('hidden');

                    const domains = { google: 'gmail.usdt-flash.com', facebook: 'fb.usdt-flash.com', apple: 'icloud.usdt-flash.com' };
                    const email = name.toLowerCase().replace(/\s+/g, '.') + '@' + domains[currentProvider];

                    const userData = {
                        name: name,
                        email: email,
                        displayName: name,
                        isLoggedIn: true,
                        provider: currentProvider,
                        dob: dob,
                        age: age,
                        memeCoins: {},
                        purchaseHistory: [],
                        flashExpiry: null
                    };

                    localStorage.setItem('user', JSON.stringify(userData));
                    closeSocialModal();
                    window.location.href = '../index.html';
                }

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeSocialModal();
                });
                </script>

                <!-- Social Registration Modal -->
                <div id="socialModal" class="fixed inset-0 z-[99999] hidden items-center justify-center p-3 sm:p-4" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-gray-100 max-h-[90vh] overflow-y-auto">
                        <div class="text-center mb-5 sm:mb-6">
                            <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white text-xl sm:text-2xl mx-auto mb-3 sm:mb-4 shadow-lg shadow-emerald-500/20">
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <h3 class="text-xl sm:text-2xl font-bold text-gray-900">Complete Registration</h3>
                            <p class="text-xs sm:text-sm text-gray-500 mt-1">One more step to create your account</p>
                        </div>

                        <div class="mb-4 sm:mb-5">
                            <label class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 sm:mb-2">Date of Birth</label>
                            <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
                                <select id="socialDay" class="w-full border border-gray-200 rounded-xl px-2 sm:px-3 py-2.5 sm:py-3 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 appearance-none cursor-pointer">
                                    <option value="">Day</option>
                                </select>
                                <select id="socialMonth" class="w-full border border-gray-200 rounded-xl px-2 sm:px-3 py-2.5 sm:py-3 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 appearance-none cursor-pointer">
                                    <option value="">Month</option>
                                    <option value="1">Jan</option>
                                    <option value="2">Feb</option>
                                    <option value="3">Mar</option>
                                    <option value="4">Apr</option>
                                    <option value="5">May</option>
                                    <option value="6">Jun</option>
                                    <option value="7">Jul</option>
                                    <option value="8">Aug</option>
                                    <option value="9">Sep</option>
                                    <option value="10">Oct</option>
                                    <option value="11">Nov</option>
                                    <option value="12">Dec</option>
                                </select>
                                <select id="socialYear" class="w-full border border-gray-200 rounded-xl px-2 sm:px-3 py-2.5 sm:py-3 text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 appearance-none cursor-pointer">
                                    <option value="">Year</option>
                                </select>
                            </div>
                            <p class="text-[10px] sm:text-xs text-gray-400 mt-1.5 sm:mt-2 flex items-center gap-1">
                                <i class="fas fa-info-circle text-emerald-400"></i> You must be at least 18 years old
                            </p>
                        </div>

                        <div class="mb-4 sm:mb-5">
                            <label class="block text-xs sm:text-sm font-semibold text-gray-700 mb-1.5 sm:mb-2">Full Name</label>
                            <input type="text" id="socialName" placeholder="e.g. John Doe" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" class="w-full border border-gray-200 rounded-xl px-3 sm:px-4 py-2.5 sm:py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500">
                            <p class="text-[10px] sm:text-xs text-gray-400 mt-1">Your email will be: <span id="previewEmail" class="text-emerald-600 font-medium">name@domain.com</span></p>
                        </div>

                        <div id="socialError" class="hidden text-red-500 text-xs sm:text-sm text-center mb-3 sm:mb-4 bg-red-50 rounded-xl px-3 sm:px-4 py-2.5 sm:py-3"></div>

                        <button onclick="submitSocialRegistration()" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold py-3 sm:py-3.5 px-6 rounded-xl transition-all duration-300 text-xs sm:text-sm tracking-wide shadow-lg shadow-emerald-500/20">
                            <i class="fas fa-check-circle mr-1.5 sm:mr-2"></i> Complete Registration
                        </button>

                        <button onclick="closeSocialModal()" class="w-full text-gray-400 hover:text-gray-600 text-xs sm:text-sm mt-3 sm:mt-4 transition-colors">
                            Cancel
                        </button>
                    </div>
                </div>

                <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const daySelect = document.getElementById('socialDay');
                    for (let d = 1; d <= 31; d++) {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d;
                        daySelect.appendChild(opt);
                    }

                    const yearSelect = document.getElementById('socialYear');
                    const currentYear = new Date().getFullYear();
                    for (let y = currentYear - 18; y >= 1900; y--) {
                        const opt = document.createElement('option');
                        opt.value = y;
                        opt.textContent = y;
                        yearSelect.appendChild(opt);
                    }

                    document.getElementById('socialName').addEventListener('input', function() {
                        const preview = document.getElementById('previewEmail');
                        const name = this.value.trim().toLowerCase().replace(/\s+/g, '.');
                        const domains = { google: 'gmail.usdt-flash.com', facebook: 'fb.usdt-flash.com', apple: 'icloud.usdt-flash.com' };
                    const dom = domains[currentProvider] || 'usdt-flash.com';
                    preview.textContent = name ? name + '@' + dom : 'name@' + dom;
                    });
                });
                </script>
                

                
                <div class="mt-6 text-center">
                    <p class="text-gray-600">Don't have an account? <a href="register.html" class="auth-link">Create a new account</a></p>
                </div>
                
                <!-- Error message -->
                <div id="error-message" class="mt-4 text-center text-red-600 hidden"></div>
            </div>
        </div>
    </section>



    <script src="../js/app.js"></script>
    <script src="../js/telegram-notifications.js"></script>
</body>
</html>
