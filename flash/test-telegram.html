<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Telegram Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .info strong {
            color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Test Telegram Bot</h1>
        
        <div class="info">
            <strong>Bot Token:</strong> 7746028957:AAE5HFQgmjm8qgZPtdn2Ot_iNmMX1ZdJ1nU<br>
            <strong>Chat ID:</strong> 2126771039
        </div>
        
        <button id="sendBtn" onclick="sendTestMessage()">
            📤 Send Test Message
        </button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        async function sendTestMessage() {
            const btn = document.getElementById('sendBtn');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerHTML = '⏳ Sending...';
            result.style.display = 'none';
            
            const TELEGRAM_BOT_TOKEN = '7746028957:AAE5HFQgmjm8qgZPtdn2Ot_iNmMX1ZdJ1nU';
            const TELEGRAM_CHAT_ID = '2126771039';
            
            const message = `
🔔 <b>Test Notification</b>

📅 <b>Date:</b> ${new Date().toLocaleString()}
━━━━━━━━━━━━━━━━━━━━

✅ <b>Status:</b> Bot is working correctly!
🌐 <b>Source:</b> Test Page
💻 <b>Device:</b> ${navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop'}

━━━━━━━━━━━━━━━━━━━━
<i>This is a test message from your Tether Platform</i>
            `;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    result.className = 'result success';
                    result.innerHTML = '✅ <strong>Success!</strong> Message sent to Telegram. Check your bot!';
                    btn.innerHTML = '✅ Message Sent!';
                } else {
                    result.className = 'result error';
                    result.innerHTML = `❌ <strong>Error:</strong> ${data.description || 'Failed to send message'}`;
                    btn.innerHTML = '❌ Failed';
                    btn.disabled = false;
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
                btn.innerHTML = '❌ Failed';
                btn.disabled = false;
            }
            
            setTimeout(() => {
                if (btn.innerHTML === '✅ Message Sent!') {
                    btn.innerHTML = '📤 Send Test Message';
                    btn.disabled = false;
                }
            }, 3000);
        }
    </script>
</body>
</html>
